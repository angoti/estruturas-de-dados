<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Widgets - Estruturas de Dados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f4f1e7;
        --surface: #fffdf8;
        --surface-2: #f0e8d5;
        --text: #202122;
        --muted: #66624f;
        --line: #d9ceb1;
        --accent: #0f766e;
        --accent-2: #dc6b1f;
        --radius: 16px;
        --shadow: 0 14px 35px rgba(53, 38, 12, 0.12);
        --font-ui: "Space Grotesk", "Segoe UI", sans-serif;
        --font-code: "JetBrains Mono", "Consolas", monospace;
      }

      body {
        min-height: 100vh;
        font-family: var(--font-ui);
        color: var(--text);
        background:
          radial-gradient(circle at 12% -5%, #fff5dd 0%, transparent 35%), radial-gradient(circle at 90% 0%, #d9f3ef 0%, transparent 34%),
          linear-gradient(180deg, #f8f4e8 0%, #f2ead9 100%);
        padding: 28px 16px 44px;
      }

      .panel {
        width: min(1040px, 100%);
        margin: 0 auto;
        background: color-mix(in srgb, var(--surface) 82%, white 18%);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero {
        padding: 28px 24px 24px;
        background: linear-gradient(120deg, rgba(15, 118, 110, 0.1) 0%, rgba(220, 107, 31, 0.1) 100%);
        border-bottom: 1px solid var(--line);
      }

      .hero h1 {
        font-size: clamp(1.35rem, 3vw, 2rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }

      .hero p {
        max-width: 740px;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.6;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) auto;
        gap: 12px;
        margin-top: 18px;
      }

      .search,
      .filter {
        border: 1px solid var(--line);
        border-radius: 12px;
        font-family: var(--font-ui);
        font-size: 0.95rem;
        background: var(--surface);
        color: var(--text);
        padding: 10px 12px;
        outline: none;
      }

      .search:focus,
      .filter:focus {
        border-color: color-mix(in srgb, var(--accent) 55%, black 10%);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent 80%);
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 0 24px;
        padding: 14px 0;
        border-bottom: 1px dashed var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .widgets {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
        padding: 18px 24px 24px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-height: 180px;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
        transform: translateY(8px);
        opacity: 0;
        animation: reveal 500ms ease forwards;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(32, 33, 34, 0.1);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line) 55%);
      }

      .card-head {
        padding: 14px 14px 8px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line) 65%);
        color: color-mix(in srgb, var(--accent) 92%, black 8%);
        background: color-mix(in srgb, var(--accent) 14%, #fff 86%);
        padding: 3px 8px;
        font-size: 0.73rem;
        white-space: nowrap;
      }

      .file {
        font-family: var(--font-code);
        color: var(--muted);
        font-size: 0.72rem;
        text-align: right;
        line-height: 1.4;
      }

      .card-body {
        padding: 0 14px 14px;
        display: grid;
        gap: 8px;
        flex: 1;
      }

      .card h2 {
        font-size: 1rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .card p {
        color: var(--muted);
        font-size: 0.89rem;
        line-height: 1.5;
      }

      .card a {
        margin-top: auto;
        width: fit-content;
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        color: #1d3c39;
        font-weight: 600;
        font-size: 0.86rem;
        padding: 8px 10px;
        transition:
          background 160ms ease,
          border-color 160ms ease;
      }

      .card a:hover {
        background: color-mix(in srgb, var(--accent) 14%, var(--surface-2) 86%);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line) 55%);
      }

      .empty {
        grid-column: 1 / -1;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        padding: 18px;
        color: var(--muted);
        text-align: center;
        background: color-mix(in srgb, var(--surface-2) 55%, white 45%);
        display: none;
      }

      footer {
        text-align: center;
        color: var(--muted);
        font-family: var(--font-code);
        font-size: 0.75rem;
        margin-top: 16px;
        padding-bottom: 8px;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 760px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .meta {
          margin: 0 16px;
        }

        .widgets {
          padding: 16px;
        }

        .hero {
          padding: 22px 16px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <h1>Painel de Widgets - Estruturas de Dados</h1>
        <p>
          Centralize o acesso aos simuladores e visualizadores da pasta docs. Use a busca e o filtro para encontrar rapidamente o widget desejado.
        </p>
        <div class="toolbar">
          <input id="search" class="search" type="search" placeholder="Buscar por nome, tema ou arquivo..." aria-label="Buscar widget" />
          <select id="themeFilter" class="filter" aria-label="Filtrar por tema">
            <option value="todos">Todos os temas</option>
            <option value="arvores">Arvores</option>
            <option value="hash">Hash</option>
            <option value="heap">Heap</option>
            <option value="grafos">Grafos</option>
          </select>
        </div>
      </header>

      <section class="meta">
        <span id="counter">0 widgets exibidos</span>
        <span>Diretorio: docs/</span>
      </section>

      <section id="widgets" class="widgets" aria-live="polite"></section>
    </main>

    <footer>IFTM - Sistemas para Internet - Estruturas de Dados</footer>

    <script>
      const widgets = [
        {
          nome: "BST Interativa",
          tema: "arvores",
          arquivo: "bst_interativa.html",
          descricao: "Visualizacao da BST com operacoes de insercao, busca e remocao.",
        },
        {
          nome: "BST Percursos",
          tema: "arvores",
          arquivo: "bst_percursos.html",
          descricao: "Explora percursos em BST e a ordem de visita dos nos.",
        },
        {
          nome: "BST Remocao - Tres Casos",
          tema: "arvores",
          arquivo: "bst_remocao_tres_casos.html",
          descricao: "Demonstra os tres cenarios de remocao em arvore de busca binaria.",
        },
        {
          nome: "In-order Iterativo",
          tema: "arvores",
          arquivo: "inorder_iterativo.html",
          descricao: "Comparacao entre percurso in-order iterativo e recursivo.",
        },
        {
          nome: "AVL - Casos de Desequilibrio",
          tema: "arvores",
          arquivo: "avl_desequilibrio_casos.html",
          descricao: "Explica visualmente os casos LL, RR, LR e RL com rotacoes.",
        },
        {
          nome: "Heap Interativo Completo",
          tema: "heap",
          arquivo: "heap_interativo_completo.html",
          descricao: "Widget para insercao, remocao, buildHeap e relacoes de indice.",
        },
        {
          nome: "Hash Table Explorer",
          tema: "hash",
          arquivo: "hash_table_explorer.html",
          descricao: "Painel sobre funcao hash, colisoes, rehashing e comparacoes.",
        },
        {
          nome: "Hash Open Addressing",
          tema: "hash",
          arquivo: "hash_open_addressing.html",
          descricao: "Explora tecnicas de enderecamento aberto para resolver colisoes.",
        },
        {
          nome: "Hash Dynamic Resize",
          tema: "hash",
          arquivo: "hash_dynamic_resize.html",
          descricao: "Visualiza redimensionamento dinamico de tabelas hash.",
        },
        {
          nome: "DFS vs BFS",
          tema: "grafos",
          arquivo: "dfs_vs_bfs.html",
          descricao: "Comparativo interativo entre busca em profundidade e largura.",
        },
      ];

      const labelsTema = {
        arvores: "Arvores",
        hash: "Hash",
        heap: "Heap",
        grafos: "Grafos",
      };

      const widgetsEl = document.getElementById("widgets");
      const searchEl = document.getElementById("search");
      const filterEl = document.getElementById("themeFilter");
      const counterEl = document.getElementById("counter");

      function cardTemplate(widget, idx) {
        const article = document.createElement("article");
        article.className = "card";
        article.style.animationDelay = `${idx * 35}ms`;

        article.innerHTML = `
        <div class="card-head">
          <span class="badge">${labelsTema[widget.tema] || widget.tema}</span>
          <span class="file">${widget.arquivo}</span>
        </div>
        <div class="card-body">
          <h2>${widget.nome}</h2>
          <p>${widget.descricao}</p>
          <a href="${widget.arquivo}" target="_self" rel="noopener">Abrir widget</a>
        </div>
      `;

        return article;
      }

      function render() {
        const termo = searchEl.value.trim().toLowerCase();
        const tema = filterEl.value;

        const filtrados = widgets.filter(item => {
          const noTema = tema === "todos" || item.tema === tema;
          const noTexto =
            item.nome.toLowerCase().includes(termo) ||
            item.descricao.toLowerCase().includes(termo) ||
            item.arquivo.toLowerCase().includes(termo) ||
            item.tema.toLowerCase().includes(termo);

          return noTema && noTexto;
        });

        widgetsEl.innerHTML = "";

        if (filtrados.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.style.display = "block";
          empty.textContent = "Nenhum widget encontrado com os filtros atuais.";
          widgetsEl.appendChild(empty);
        } else {
          filtrados.forEach((widget, idx) => {
            widgetsEl.appendChild(cardTemplate(widget, idx));
          });
        }

        counterEl.textContent = `${filtrados.length} widget${filtrados.length === 1 ? "" : "s"} exibido${filtrados.length === 1 ? "" : "s"}`;
      }

      searchEl.addEventListener("input", render);
      filterEl.addEventListener("change", render);

      render();
    </script>
  </body>
</html>
