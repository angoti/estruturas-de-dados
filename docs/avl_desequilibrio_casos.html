
<style>
.tab-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.tab { padding:5px 16px; font-size:13px; font-weight:500; border-radius:20px; cursor:pointer; border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-secondary); transition:all .15s; }
.tab.on { background:var(--color-background-primary); color:var(--color-text-primary); border-color:var(--color-border-primary); box-shadow:0 0 0 1px var(--color-border-primary); }
.tab:hover:not(.on) { background:var(--color-background-secondary); }
.desc-block { font-size:13px; line-height:1.6; color:var(--color-text-secondary); margin-bottom:16px; }
.desc-block strong { color:var(--color-text-primary); font-weight:500; }
.legend { display:flex; gap:16px; margin-top:12px; font-size:12px; color:var(--color-text-secondary); }
.leg-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle; }
</style>

<div class="tab-row" id="tabs">
  <button class="tab on" onclick="show('LL',this)">Caso LL</button>
  <button class="tab" onclick="show('RR',this)">Caso RR</button>
  <button class="tab" onclick="show('LR',this)">Caso LR</button>
  <button class="tab" onclick="show('RL',this)">Caso RL</button>
</div>

<div class="desc-block" id="desc"></div>

<svg id="sv" width="100%" viewBox="0 0 680 310" style="overflow:visible"></svg>

<div class="legend">
  <span><span class="leg-dot" style="background:#F09595;border:1px solid #A32D2D"></span>fator ±2 (desequilíbrio)</span>
  <span><span class="leg-dot" style="background:#EF9F27;border:1px solid #854F0B"></span>fator ±1 (atenção)</span>
  <span><span class="leg-dot" style="background:#97C459;border:1px solid #3B6D11"></span>fator 0 (balanceado)</span>
</div>

<script>
const CASOS = {
  LL:{
    label:'Caso LL — Rotação simples à direita',
    desc:'O nó <strong>A</strong> tem fator +2 e o filho esquerdo <strong>B</strong> tem fator +1 (ou 0). Desequilíbrio à <strong>esquerda da subárvore esquerda</strong>. Solução: uma rotação simples à direita em A — B sobe, A desce como filho direito de B.',
    rot:'rotação à direita em A',
    antes:[
      {id:'A',label:'A',fb:'+2',x:170,y:60,cor:'r'},
      {id:'B',label:'B',fb:'+1',x:100,y:150,cor:'a'},
      {id:'C',label:'C',fb:'0', x:44, y:240,cor:'g'},
    ],
    arestas_a:[['A','B'],['B','C']],
    depois:[
      {id:'B',label:'B',fb:'0',x:170,y:60,cor:'g'},
      {id:'C',label:'C',fb:'0',x:100,y:150,cor:'g'},
      {id:'A',label:'A',fb:'0',x:240,y:150,cor:'g'},
    ],
    arestas_d:[['B','C'],['B','A']],
  },
  RR:{
    label:'Caso RR — Rotação simples à esquerda',
    desc:'O nó <strong>A</strong> tem fator −2 e o filho direito <strong>B</strong> tem fator −1 (ou 0). Desequilíbrio à <strong>direita da subárvore direita</strong>. Solução: uma rotação simples à esquerda em A — B sobe, A desce como filho esquerdo de B.',
    rot:'rotação à esquerda em A',
    antes:[
      {id:'A',label:'A',fb:'−2',x:170,y:60,cor:'r'},
      {id:'B',label:'B',fb:'−1',x:240,y:150,cor:'a'},
      {id:'C',label:'C',fb:'0', x:296,y:240,cor:'g'},
    ],
    arestas_a:[['A','B'],['B','C']],
    depois:[
      {id:'B',label:'B',fb:'0',x:170,y:60,cor:'g'},
      {id:'A',label:'A',fb:'0',x:100,y:150,cor:'g'},
      {id:'C',label:'C',fb:'0',x:240,y:150,cor:'g'},
    ],
    arestas_d:[['B','A'],['B','C']],
  },
  LR:{
    label:'Caso LR — Rotação dupla: esquerda e depois direita',
    desc:'O nó <strong>A</strong> tem fator +2, mas o filho esquerdo <strong>B</strong> tem fator −1 — o neto <strong>C</strong> está do lado oposto (zig-zag). Solução: rotação à esquerda em B, depois rotação à direita em A. C sobe como nova raiz.',
    rot:'← esquerda em B, depois → direita em A',
    antes:[
      {id:'A',label:'A',fb:'+2',x:170,y:60,cor:'r'},
      {id:'B',label:'B',fb:'−1',x:100,y:150,cor:'a'},
      {id:'C',label:'C',fb:'0', x:156,y:240,cor:'g'},
    ],
    arestas_a:[['A','B'],['B','C']],
    depois:[
      {id:'C',label:'C',fb:'0',x:170,y:60,cor:'g'},
      {id:'B',label:'B',fb:'0',x:100,y:150,cor:'g'},
      {id:'A',label:'A',fb:'0',x:240,y:150,cor:'g'},
    ],
    arestas_d:[['C','B'],['C','A']],
  },
  RL:{
    label:'Caso RL — Rotação dupla: direita e depois esquerda',
    desc:'O nó <strong>A</strong> tem fator −2, mas o filho direito <strong>B</strong> tem fator +1 — o neto <strong>C</strong> está do lado oposto (zig-zag). Solução: rotação à direita em B, depois rotação à esquerda em A. C sobe como nova raiz.',
    rot:'→ direita em B, depois ← esquerda em A',
    antes:[
      {id:'A',label:'A',fb:'−2',x:170,y:60,cor:'r'},
      {id:'B',label:'B',fb:'+1',x:240,y:150,cor:'a'},
      {id:'C',label:'C',fb:'0', x:184,y:240,cor:'g'},
    ],
    arestas_a:[['A','B'],['B','C']],
    depois:[
      {id:'C',label:'C',fb:'0',x:170,y:60,cor:'g'},
      {id:'A',label:'A',fb:'0',x:100,y:150,cor:'g'},
      {id:'B',label:'B',fb:'0',x:240,y:150,cor:'g'},
    ],
    arestas_d:[['C','A'],['C','B']],
  }
};

const COR = {
  r:{fill:'#FCEBEB',stroke:'#A32D2D',nome:'#791F1F',fb:'#A32D2D'},
  a:{fill:'#FAEEDA',stroke:'#854F0B',nome:'#633806',fb:'#854F0B'},
  g:{fill:'#EAF3DE',stroke:'#3B6D11',nome:'#27500A',fb:'#3B6D11'},
};

const R = 28;
const OX = 340;

function noPos(nos) {
  const m = {};
  nos.forEach(n => m[n.id] = {x:n.x, y:n.y});
  return m;
}

function drawTree(svg, nos, arestas, offX, cor_arestas) {
  const pos = noPos(nos);
  arestas.forEach(([a,b]) => {
    const pa = pos[a], pb = pos[b];
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const x1 = pa.x + offX + (dx/dist)*R;
    const y1 = pa.y + (dy/dist)*R;
    const x2 = pb.x + offX - (dx/dist)*(R+2);
    const y2 = pb.y - (dy/dist)*(R+2);
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke', cor_arestas||'var(--color-border-secondary)');
    l.setAttribute('stroke-width','1');
    l.setAttribute('marker-end','url(#arr)');
    svg.insertBefore(l, svg.querySelector('g'));
  });
  nos.forEach(n => {
    const c = COR[n.cor];
    const cx = n.x + offX, cy = n.y;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circ.setAttribute('cx',cx); circ.setAttribute('cy',cy); circ.setAttribute('r',R);
    circ.setAttribute('fill',c.fill); circ.setAttribute('stroke',c.stroke); circ.setAttribute('stroke-width','1');
    const tNome = document.createElementNS('http://www.w3.org/2000/svg','text');
    tNome.setAttribute('x',cx); tNome.setAttribute('y',cy-7);
    tNome.setAttribute('text-anchor','middle'); tNome.setAttribute('dominant-baseline','central');
    tNome.setAttribute('font-size','15'); tNome.setAttribute('font-weight','500');
    tNome.setAttribute('fill',c.nome); tNome.textContent = n.label;
    const tFb = document.createElementNS('http://www.w3.org/2000/svg','text');
    tFb.setAttribute('x',cx); tFb.setAttribute('y',cy+10);
    tFb.setAttribute('text-anchor','middle'); tFb.setAttribute('dominant-baseline','central');
    tFb.setAttribute('font-size','11'); tFb.setAttribute('fill',c.fb);
    tFb.textContent = '('+n.fb+')';
    g.appendChild(circ); g.appendChild(tNome); g.appendChild(tFb);
    svg.appendChild(g);
  });
}

function show(id, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const c = CASOS[id];
  document.getElementById('desc').innerHTML = '<strong>'+c.label+'</strong><br>'+c.desc;
  const svg = document.getElementById('sv');
  svg.innerHTML = `<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="var(--color-border-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>`;

  const divX = OX;

  const div = document.createElementNS('http://www.w3.org/2000/svg','line');
  div.setAttribute('x1',divX); div.setAttribute('y1',20);
  div.setAttribute('x2',divX); div.setAttribute('y2',290);
  div.setAttribute('stroke','var(--color-border-tertiary)'); div.setAttribute('stroke-width','0.5'); div.setAttribute('stroke-dasharray','4 3');
  svg.appendChild(div);

  const mkLabel = (x,y,txt,cor) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','12'); t.setAttribute('font-weight','500'); t.setAttribute('fill',cor||'var(--color-text-secondary)');
    t.textContent = txt; svg.appendChild(t);
  };
  mkLabel(divX/2, 22, 'antes da rotação', '#A32D2D');
  mkLabel(divX + divX/2, 22, 'após rotação', '#3B6D11');

  const arrSvg = document.createElementNS('http://www.w3.org/2000/svg','line');
  arrSvg.setAttribute('x1',divX-32); arrSvg.setAttribute('y1',148);
  arrSvg.setAttribute('x2',divX+32); arrSvg.setAttribute('y2',148);
  arrSvg.setAttribute('stroke','#BA7517'); arrSvg.setAttribute('stroke-width','1.5');
  arrSvg.setAttribute('marker-end','url(#amber-arrow)');
  const defAmber = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defAmber.innerHTML = `<marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 2L8 5L2 8" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  svg.appendChild(defAmber);
  svg.appendChild(arrSvg);
  mkLabel(divX, 163, c.rot, '#BA7517');

  drawTree(svg, c.antes, c.arestas_a, 0, 'var(--color-border-secondary)');
  drawTree(svg, c.depois, c.arestas_d, divX, '#3B6D11');

  const captAntes = c.antes[0];
  const captDepois = c.depois[0];
  const subA = document.createElementNS('http://www.w3.org/2000/svg','text');
  subA.setAttribute('x', divX/2); subA.setAttribute('y', 288);
  subA.setAttribute('text-anchor','middle'); subA.setAttribute('font-size','11');
  subA.setAttribute('fill','#A32D2D');
  subA.textContent = 'inserção cria desequilíbrio em '+captAntes.label;
  svg.appendChild(subA);

  const subD = document.createElementNS('http://www.w3.org/2000/svg','text');
  subD.setAttribute('x', divX+divX/2); subD.setAttribute('y', 288);
  subD.setAttribute('text-anchor','middle'); subD.setAttribute('font-size','11');
  subD.setAttribute('fill','#3B6D11');
  subD.textContent = captDepois.label+' sobe como nova raiz';
  svg.appendChild(subD);
}

show('LL', document.querySelector('.tab.on'));
</script>
